{% extends "base.html" %}

{% block title %}Log in · HomeTemp{% endblock %}

{% block content %}
<main class="relative z-10 min-h-screen flex items-center justify-center px-4">
  <form method="post" class="tile w-full max-w-sm !min-h-0 !p-6">
    {% csrf_token %}
    <h1 class="text-[28px] font-bold tracking-tight">HomeTemp</h1>
    {% if form.errors %}<p class="mt-3 text-sm text-[var(--warn)]">That username and password didn't match.</p>{% endif %}
    <label class="mt-4 block text-sm font-medium">Username
      <input name="username" autocomplete="username" autofocus required
             class="field mt-1 w-full">
    </label>
    <label class="mt-3 block text-sm font-medium">Password
      <input name="password" type="password" autocomplete="current-password" required
             class="field mt-1 w-full">
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary mt-5">Log in</button>
  </form>
</main>
{% endblock %}
