{% extends "base.html" %}

{% block title %}Log in · HomeTemp{% endblock %}

{% block content %}
<main class="min-h-screen flex items-center justify-center px-4">
  <form method="post" class="w-full max-w-sm rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    <h1 class="text-xl font-semibold">HomeTemp</h1>
    {% if form.errors %}<p class="mt-3 text-sm text-red-700">That username and password didn't match.</p>{% endif %}
    <label class="mt-4 block text-sm font-medium">Username
      <input name="username" autocomplete="username" autofocus required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
    </label>
    <label class="mt-3 block text-sm font-medium">Password
      <input name="password" type="password" autocomplete="current-password" required
             class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-400">
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="mt-5 w-full rounded-lg bg-slate-900 px-3 py-2 font-medium text-white hover:bg-slate-700">Log in</button>
  </form>
</main>
{% endblock %}
